<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2ffe2">
  <title>Nacho on the Move</title>
  <style>
    :root {
      --background: #f2ffe2;
      --nacho-width: clamp(150px, 25vw, 286px);
      --edge: clamp(10px, 3vw, 42px);
      --walk-tilt: 14deg;
      --walk-depth-tilt: 30deg;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: var(--background);
      font-family: system-ui, sans-serif;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 360px;
      overflow: hidden;
      background: var(--background);
    }

    .walker {
      position: absolute;
      bottom: clamp(18px, 5vh, 56px);
      left: var(--edge);
      width: var(--nacho-width);
      perspective: 900px;
      transform-origin: center bottom;
      animation: patrol 12s linear infinite;
      will-change: left, transform;
    }

    .character {
      position: relative;
      width: 100%;
      aspect-ratio: 286 / 356;
      transform-origin: center bottom;
      transform-style: preserve-3d;
      animation: pose 12s ease-in-out infinite;
      will-change: transform;
    }

    .nacho {
      display: block;
      width: 100%;
      height: auto;
      background: var(--background);
      backface-visibility: hidden;
      user-select: none;
      -webkit-user-drag: none;
    }

    .leg {
      position: absolute;
      top: 89.6%;
      width: clamp(1.5px, 0.2vw, 2.3px);
      height: 9.8%;
      border-radius: 999px;
      background: #2e2b2b;
      transform-origin: center top;
      will-change: transform;
    }

    .leg::after {
      content: "";
      position: absolute;
      bottom: 0;
      width: clamp(10px, 4vw, 18px);
      height: inherit;
      max-height: 2.3px;
      border-radius: 999px;
      background: inherit;
    }

    .leg-left {
      left: 42.7%;
      animation: left-leg 12s ease-in-out infinite;
    }

    .leg-left::after {
      right: -1px;
      transform-origin: right center;
      transform: rotate(-5deg);
    }

    .leg-right {
      left: 55.6%;
      animation: right-leg 12s ease-in-out infinite;
    }

    .leg-right::after {
      left: -1px;
      transform-origin: left center;
      transform: rotate(5deg);
    }

    .shadow {
      position: absolute;
      z-index: -1;
      left: 20%;
      right: 20%;
      bottom: 0;
      height: 3.5%;
      min-height: 5px;
      border-radius: 50%;
      background: rgb(92 83 47 / 16%);
      filter: blur(5px);
      animation: shadow-pose 12s ease-in-out infinite;
    }

    .motion-toggle {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 2;
      padding: 0.6rem 0.85rem;
      border: 1px solid rgb(0 52 118 / 18%);
      border-radius: 999px;
      color: #003476;
      background: rgb(255 255 255 / 72%);
      font: 600 0.82rem/1 system-ui, sans-serif;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }

    .motion-toggle:hover {
      background: rgb(255 255 255 / 92%);
    }

    .motion-toggle:focus-visible {
      outline: 3px solid #4285f4;
      outline-offset: 3px;
    }

    body.paused .walker,
    body.paused .character,
    body.paused .leg,
    body.paused .shadow {
      animation-play-state: paused;
    }

    @keyframes patrol {
      0% {
        left: var(--edge);
        transform: scaleX(1);
      }
      33% {
        left: calc(100% - var(--nacho-width) - var(--edge));
        transform: scaleX(1);
      }
      61.99% {
        left: calc(100% - var(--nacho-width) - var(--edge));
        transform: scaleX(1);
      }
      62% {
        left: calc(100% - var(--nacho-width) - var(--edge));
        transform: scaleX(-1);
      }
      99.99% {
        left: var(--edge);
        transform: scaleX(-1);
      }
      100% {
        left: var(--edge);
        transform: scaleX(1);
      }
    }

    @keyframes pose {
      0%, 8%, 16%, 24%, 32%, 33%, 70%, 78%, 86%, 94%, 100% {
        transform: translateY(0) rotateZ(var(--walk-tilt)) rotateY(var(--walk-depth-tilt)) scaleY(1);
      }
      4%, 12%, 20%, 28%, 66%, 74%, 82%, 90%, 98% {
        transform: translateY(-9px) rotateZ(var(--walk-tilt)) rotateY(var(--walk-depth-tilt)) scaleY(0.985);
      }
      40%, 49% {
        transform: translateY(28px) rotateZ(0) rotateY(0) scaleY(0.92);
      }
      53% {
        transform: translateY(34px) rotateZ(0) rotateY(0) scaleY(0.87);
      }
      56.5% {
        transform: translateY(-46px) rotateZ(0) rotateY(0) scaleY(1.025);
      }
      59.5% {
        transform: translateY(5px) rotateZ(0) rotateY(0) scaleY(0.95);
      }
      62% {
        transform: translateY(0) rotateZ(0) rotateY(0) scaleY(1);
      }
    }

    @keyframes left-leg {
      0%, 8%, 16%, 24%, 32%, 33%, 62%, 70%, 78%, 86%, 94%, 100% {
        transform: rotate(19deg) scaleY(0.94);
      }
      4%, 12%, 20%, 28%, 66%, 74%, 82%, 90%, 98% {
        transform: rotate(-20deg) scaleY(1);
      }
      40%, 49% {
        transform: rotate(68deg) scaleY(0.46);
      }
      53% {
        transform: rotate(35deg) scaleY(0.54);
      }
      56.5% {
        transform: rotate(8deg) scaleY(0.88);
      }
      59.5% {
        transform: rotate(27deg) scaleY(0.72);
      }
    }

    @keyframes right-leg {
      0%, 8%, 16%, 24%, 32%, 33%, 62%, 70%, 78%, 86%, 94%, 100% {
        transform: rotate(-20deg) scaleY(1);
      }
      4%, 12%, 20%, 28%, 66%, 74%, 82%, 90%, 98% {
        transform: rotate(19deg) scaleY(0.94);
      }
      40%, 49% {
        transform: rotate(-68deg) scaleY(0.46);
      }
      53% {
        transform: rotate(-35deg) scaleY(0.54);
      }
      56.5% {
        transform: rotate(-8deg) scaleY(0.88);
      }
      59.5% {
        transform: rotate(-27deg) scaleY(0.72);
      }
    }

    @keyframes shadow-pose {
      0%, 8%, 16%, 24%, 32%, 33%, 62%, 70%, 78%, 86%, 94%, 100% {
        opacity: 0.72;
        transform: scaleX(1);
      }
      4%, 12%, 20%, 28%, 66%, 74%, 82%, 90%, 98% {
        opacity: 0.46;
        transform: scaleX(0.82);
      }
      40%, 49%, 53%, 59.5% {
        opacity: 0.76;
        transform: scaleX(1.08);
      }
      56.5% {
        opacity: 0.16;
        transform: scaleX(0.58);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .walker {
        left: 50%;
        animation: none;
        transform: translateX(-50%);
      }

      .character,
      .leg,
      .shadow {
        animation: none;
      }

      .motion-toggle {
        display: none;
      }
    }
  </style>
</head>
